# Decap CMS — every homepage section is editable here.
# Live at https://muhahmmaad.github.io/admin/
#
# SETUP: `base_url` must point at the OAuth helper. See docs/CMS-SETUP.md.

backend:
  name: github
  repo: muhahmmaad/muhahmmaad.github.io
  branch: main
  base_url: https://portfolio-cms-auth.private-talos.workers.dev

# Only used on localhost. Ignored on the live site.
local_backend: true

media_folder: assets/img/uploads
public_folder: /assets/img/uploads

site_url: https://muhahmmaad.github.io
display_url: https://muhahmmaad.github.io
logo_url: https://muhahmmaad.github.io/assets/img/favicon.svg

collections:
  - name: appearance
    label: Theme & appearance
    description: Colours, font, light/dark, favicon, extra CSS.
    editor:
      preview: false
    files:
      - name: theme
        label: Theme
        file: _data/theme.yml
        fields:
          - label: Accent colour (hue)
            name: hue
            widget: number
            min: 0
            max: 360
            value_type: int
            hint: "250 purple · 142 green · 230 blue · 340 pink · 25 orange"
          - label: Font
            name: font
            widget: select
            options:
              - Poppins
              - Inter
              - Lato
              - Montserrat
              - Nunito
              - Playfair Display
              - Roboto
              - Source Sans 3
          - label: Default theme
            name: default_mode
            widget: select
            options:
              - { label: Light, value: light }
              - { label: Dark, value: dark }
          - label: Home title size
            name: hero_size
            widget: select
            options:
              - { label: Small, value: "1.5rem" }
              - { label: Medium, value: "2rem" }
              - { label: Large, value: "2.5rem" }
              - { label: Extra large, value: "3rem" }
          - label: Section title size
            name: section_size
            widget: select
            options:
              - { label: Small, value: "1.1rem" }
              - { label: Medium, value: "1.25rem" }
              - { label: Large, value: "1.5rem" }
              - { label: Extra large, value: "2rem" }
          - label: Subtitle size
            name: subtitle_size
            widget: select
            options:
              - { label: Small, value: "0.8rem" }
              - { label: Medium, value: "0.875rem" }
              - { label: Large, value: "1rem" }
              - { label: Extra large, value: "1.125rem" }
          - label: Body text size
            name: body_size
            widget: select
            options:
              - { label: Small, value: "0.85rem" }
              - { label: Medium, value: "0.938rem" }
              - { label: Large, value: "1.05rem" }
              - { label: Extra large, value: "1.15rem" }
          - label: Small text size
            name: small_size
            widget: select
            options:
              - { label: Small, value: "0.7rem" }
              - { label: Medium, value: "0.813rem" }
              - { label: Large, value: "0.875rem" }
          - { label: Favicon, name: favicon, widget: crop-image, required: false, aspect_ratio: "1/1" }
          - label: Extra CSS
            name: custom_css
            widget: text
            required: false
            hint: Optional. Advanced — pasted into every page.

  - name: homepage
    label: Homepage
    description: Change any part of the live homepage. Publish and the site rebuilds in a minute.
    editor:
      preview: false
    files:
      - name: identity
        label: Site settings
        file: _data/identity.yml
        fields:
          - { label: Full name, name: name, widget: string, hint: This is the name on the homepage, logo, footer and browser tab. }
          - { label: Name badge, name: name_badge, widget: crop-image, required: false, aspect_ratio: "1/1", hint: Upload, crop, then it sits next to the name. }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Site description (SEO), name: description, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: CV / resume PDF, name: cv_file, widget: file, required: false, hint: Upload a PDF. Keep the same button working on the homepage. }
          - { label: CV download filename, name: cv_filename, widget: string, required: false, hint: e.g. Muhammad-Ahmad-CV.pdf }
          - label: Social links
            name: social
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: URL, name: url, widget: string }
              - { label: Icon class, name: icon, widget: string, hint: "Unicons class, e.g. uil uil-linkedin-alt" }
          - label: Navigation
            name: nav
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string, hint: "Page section like #about, or /blog/" }
              - { label: Icon class, name: icon, widget: string }
          - label: Footer links
            name: footer_links
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Link, name: href, widget: string }

      - name: home
        label: Home / hero
        file: _data/home.yml
        fields:
          - { label: Greeting before name, name: greeting, widget: string, hint: "Shown before Full name, e.g. Hi, I'm" }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Photo, name: image, widget: crop-image, aspect_ratio: "200/187", hint: Crop to fit the blob frame on the homepage. }
          - { label: Button text, name: cta_label, widget: string }
          - { label: Button link, name: cta_link, widget: string }
          - { label: Scroll label, name: scroll_label, widget: string }

      - name: about
        label: About
        file: _data/about.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Photo, name: image, widget: crop-image, aspect_ratio: "200/187", hint: Crop to fit the same blob frame as the home photo. }
          - { label: Description, name: description, widget: text }
          - label: Stats (the number boxes on About)
            name: stats
            widget: list
            collapsed: false
            minimize_collapsed: false
            label_singular: Stat
            summary: "{{value}} {{label}}"
            fields:
              - { label: Number, name: value, widget: string, hint: "e.g. 1.5+ or 04" }
              - { label: Label under the number, name: label, widget: string, hint: "e.g. Years experience" }
          - { label: CV button text, name: cv_label, widget: string }

      - name: skills
        label: Skills
        file: _data/skills.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: Skill groups
            name: groups
            widget: list
            collapsed: false
            summary: "{{title}}"
            fields:
              - { label: Group title, name: title, widget: string }
              - { label: Group subtitle, name: subtitle, widget: string }
              - { label: Icon class, name: icon, widget: string, hint: "e.g. uil uil-megaphone" }
              - label: Skill bars
                name: items
                widget: list
                collapsed: false
                minimize_collapsed: false
                label_singular: Skill bar
                summary: "{{name}} {{percent}}%"
                fields:
                  - { label: Skill name, name: name, widget: string }
                  - { label: Bar percent, name: percent, widget: number, min: 0, max: 100, value_type: int, hint: "0–100. This is the coloured bar on the site." }

      - name: qualification
        label: Qualification
        file: _data/qualification.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Education tab label, name: education_label, widget: string }
          - { label: Experience tab label, name: experience_label, widget: string }
          - label: Education
            name: education
            widget: list
            collapsed: false
            minimize_collapsed: false
            label_singular: Education item
            summary: "{{title}} — {{date}}"
            fields:
              - { label: Degree / title, name: title, widget: string }
              - { label: University / place, name: subtitle, widget: string }
              - { label: Year or date, name: date, widget: string }
          - label: Experience
            name: experience
            widget: list
            collapsed: false
            minimize_collapsed: false
            label_singular: Experience item
            summary: "{{title}} — {{date}}"
            fields:
              - { label: Job title, name: title, widget: string }
              - { label: Company / place, name: subtitle, widget: string }
              - { label: Dates, name: date, widget: string }

      - name: services
        label: Services
        file: _data/services.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: View more button
            name: more_label
            widget: string
          - label: Services
            name: items
            widget: list
            collapsed: false
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Icon class, name: icon, widget: string, hint: "e.g. uil uil-megaphone" }
              - label: Points
                name: points
                widget: list
                collapsed: false
                minimize_collapsed: false
                field: { label: Point, name: point, widget: string }

      - name: research
        label: Research
        file: _data/research.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: Publications
            name: items
            widget: list
            collapsed: false
            minimize_collapsed: false
            label_singular: Publication
            summary: "{{title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Meta (authors / type), name: meta, widget: string, required: false }
              - { label: Status, name: status, widget: string, required: false }
              - { label: Image, name: image, widget: crop-image, required: false, aspect_ratio: "4/3" }
              - { label: Description, name: description, widget: text }

      - name: cta
        label: Campaign banner
        file: _data/cta.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Button text, name: button_label, widget: string }
          - { label: Button link, name: button_link, widget: string }
          - { label: Image, name: image, widget: crop-image, aspect_ratio: "4/3" }

      - name: references
        label: References
        file: _data/references.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - label: Referees
            name: items
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{name}}"
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Photo, name: image, widget: crop-image, required: false, aspect_ratio: "200/187", hint: Same blob frame as the profile photos. }
              - { label: Quote, name: quote, widget: text }

      - name: insights
        label: Insights (blog teaser)
        file: _data/insights.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: All posts button, name: all_posts_label, widget: string }

      - name: contact
        label: Contact
        file: _data/contact.yml
        fields:
          - { label: Title, name: title, widget: string }
          - { label: Subtitle, name: subtitle, widget: string }
          - { label: Submit button, name: submit_label, widget: string }
          - { label: Form action URL, name: form_action, widget: string, hint: Leave as formsubmit.co and messages go to Site settings email. }
          - { label: Email subject, name: form_subject, widget: string }
          - label: Contact info
            name: info
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{label}}: {{value}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Value, name: value, widget: string }
              - { label: Icon class, name: icon, widget: string }
          - label: Form fields
            name: fields
            widget: list
            collapsed: false
            minimize_collapsed: false
            summary: "{{label}}"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: Field name, name: name, widget: string }
              - label: Type
                name: type
                widget: select
                options: [text, email, tel, url, textarea]
              - { label: Required, name: required, widget: boolean, default: true }
              - { label: Half width, name: half, widget: boolean, default: false }

  - name: posts
    label: Blog posts
    label_singular: Blog post
    description: Write a post, drop in a cover image, hit Publish. The site rebuilds itself within a minute or two.
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title}}"
    preview_path: "blog/{{fields.title}}"
    preview_path_date_field: date
    sortable_fields: [date, title]
    fields:
      - { label: Title, name: title, widget: string, hint: Shown on the card and at the top of the post. }
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        hint: Posts are listed newest first. A future date hides the post until that date.
      - { label: Short description, name: description, widget: text, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Cover image, name: image, widget: crop-image, required: false, aspect_ratio: "4/3" }
      - { label: Video link, name: video, widget: string, required: false, hint: YouTube, Vimeo or Instagram URL. Do not upload video files. }
      - { label: Body, name: body, widget: markdown }
