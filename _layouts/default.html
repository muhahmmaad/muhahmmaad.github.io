<!DOCTYPE html>
<html lang="en" data-admin="{{ '/admin/' | relative_url }}">
<head>
    {% include head.html %}
</head>
<body data-default-theme="{{ site.data.theme.default_mode | default: 'light' }}">
    <div class="theme-wash" aria-hidden="true"></div>
    {% include header.html %}

    <main class="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <!--==================== SCROLL TOP ====================-->
    <a href="#" class="scrollup" id="scroll-up" aria-label="Back to top">
        <i class="uil uil-arrow-up scrollup__icon"></i>
    </a>

    <!--==================== SWIPER JS ====================-->
    <script src="{{ '/assets/js/swiper-bundle.min.js' | relative_url }}"></script>

    <!--==================== MAIN JS ====================-->
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/live-content.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/quick-edit.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/contact-form.js' | relative_url }}"></script>
</body>
</html>
