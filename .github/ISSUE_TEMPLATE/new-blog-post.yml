name: New blog post
description: Write a post. Submitting this publishes it to the site.
title: "[post] "
labels: ["blog-post"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this in and press **Create**. A minute later the post is live on
        the site and this form closes itself.

        To add pictures, drag them straight into the **Post** box below —
        GitHub uploads them and inserts the link for you.

  - type: input
    id: post_title
    attributes:
      label: Title
      description: Shown on the blog card and at the top of the post.
      placeholder: What Makes an Influencer Campaign Work
    validations:
      required: true

  # The options below are refreshed automatically after each post is
  # published — see .github/scripts/refresh-category-options.js
  - type: dropdown
    id: category
    attributes:
      label: Category
      description: Pick one, or leave this and type a new one in the next box.
      options:
        - '— pick one, or add a new one below —'
        - 'Influencer Marketing'
        - 'Research'
        - 'Social Media'
    validations:
      required: false

  - type: input
    id: new_category
    attributes:
      label: Or a new category
      description: >-
        Type anything here to create a category that does not exist yet. It
        will be added to the dropdown above for next time. Leave blank to use
        the dropdown.
      placeholder: Content Strategy
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Short description
      description: One or two sentences. Appears on the card and in Google results.
      placeholder: Reach is the easiest number to buy and the least useful one to report.
    validations:
      required: true

  - type: input
    id: cover
    attributes:
      label: Cover image link
      description: >-
        Optional. Drag an image into the Post box below, then copy the link it
        creates and paste it here. Leave blank to use a generated cover.
      placeholder: https://github.com/user-attachments/assets/...
    validations:
      required: false

  - type: textarea
    id: body
    attributes:
      label: Post
      description: >-
        Write normally. Blank line between paragraphs. Start a line with "## "
        to make a heading, and "- " to make a bullet.
      placeholder: |
        Most briefs I receive open with a follower count.

        ## Fit beats size

        A creator with 15,000 engaged followers will often outperform...
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Publish date
      description: >-
        Optional. Leave blank for today. A future date keeps the post hidden
        until then. Format YYYY-MM-DD.
      placeholder: 2026-09-01
    validations:
      required: false
